# Render blueprint — API plus the scheduled jobs the API does not run in-process.
#
# Background work (transactional outbox flushing, reminder emails, payment
# reconciliation) runs as Render cron jobs invoking `python -m app.cli`, so no
# Celery worker and no Redis are deployed. Local development keeps Celery
# (worker + beat) through docker-compose.yml.
#
# Secrets are never stored in this file:
#   * `sync: false` — value is typed once in the Render dashboard.
#   * `generateValue: true` — Render mints the value on first creation.
#   * Cron jobs inherit everything from the API service via `fromService.envVarKey`.
#
# Removing the worker and Redis here means a blueprint sync deletes those two
# Render services if they were blueprint-managed.

services:
  - type: web
    name: travel-system-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.api
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false # Neon pooled URL (must be ?ssl=require, never ?sslmode=)
      - key: DATABASE_URL_DIRECT
        sync: false # Neon direct URL, used by Alembic
      - key: ADMIN_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false # base64 32-byte key; never rotate once real data exists
      - key: CORS_ORIGINS
        sync: false # Vercel domain(s), comma separated
      - key: FRONTEND_URL
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      - key: BASE_CURRENCY
        value: UGX

  # Cron jobs build the same image as the API and only override the command.
  # `dockerCommand` is the documented override for runtime: docker; `startCommand`
  # is set to the identical value so either field Render honours is correct.
  - type: cron
    name: travel-system-outbox-sync
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.api
    dockerContext: .
    plan: starter
    schedule: "*/5 * * * *" # UTC
    dockerCommand: python -m app.cli outbox 200
    startCommand: python -m app.cli outbox 200
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromService:
          type: web
          name: travel-system-api
          envVarKey: DATABASE_URL
      - key: DATABASE_URL_DIRECT
        fromService:
          type: web
          name: travel-system-api
          envVarKey: DATABASE_URL_DIRECT
      - key: ADMIN_DATABASE_URL
        fromService:
          type: web
          name: travel-system-api
          envVarKey: ADMIN_DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: travel-system-api
          envVarKey: SECRET_KEY
      - key: JWT_SECRET
        fromService:
          type: web
          name: travel-system-api
          envVarKey: JWT_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          type: web
          name: travel-system-api
          envVarKey: JWT_REFRESH_SECRET
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: travel-system-api
          envVarKey: ENCRYPTION_KEY
      - key: FRONTEND_URL
        fromService:
          type: web
          name: travel-system-api
          envVarKey: FRONTEND_URL
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_ENDPOINT
        fromService:
          type: web
          name: travel-system-api
          envVarKey: STORAGE_ENDPOINT
      - key: STORAGE_BUCKET
        fromService:
          type: web
          name: travel-system-api
          envVarKey: STORAGE_BUCKET
      - key: STORAGE_ACCESS_KEY
        fromService:
          type: web
          name: travel-system-api
          envVarKey: STORAGE_ACCESS_KEY
      - key: STORAGE_SECRET_KEY
        fromService:
          type: web
          name: travel-system-api
          envVarKey: STORAGE_SECRET_KEY
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        fromService:
          type: web
          name: travel-system-api
          envVarKey: EMAIL_FROM
      - key: RESEND_API_KEY
        fromService:
          type: web
          name: travel-system-api
          envVarKey: RESEND_API_KEY
      - key: PAYMENT_PROVIDER
        value: mock
      - key: BASE_CURRENCY
        value: UGX

