name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Deploys are automatic, not CI-driven: Render redeploys the API and Vercel
# redeploys the frontend on every push to main. CI is the gate in front of them,
# and the smoke job re-checks the deployed stack after the Render deploy lands.

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Pytest
        env:
          SECRET_KEY: ci-secret
          JWT_SECRET: ci-jwt
          JWT_REFRESH_SECRET: ci-refresh
          ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DATABASE_URL_DIRECT: "sqlite+aiosqlite:///:memory:"
          ADMIN_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: redis://localhost:6379/0
        run: |
          set +e
          pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 40 pytest.log | sed 's/%/%25/g' | tr -d '\r' | awk 'BEGIN { ORS="%0A" } { print }')
            echo "::error title=Pytest failure::$summary"
          fi
          exit "$status"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example.onrender.com

  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install httpx
        run: python -m pip install httpx
      - name: Wait for Render deploy
        run: sleep 75
      - name: Run smoke test
        env:
          SMOKE_API_URL: ${{ secrets.SMOKE_API_URL }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          if [ -z "$SMOKE_API_URL" ]; then
            echo "SMOKE_API_URL secret is not configured - skipping smoke test."
            exit 0
          fi
          python scripts/smoke_test.py

