# Render Blueprint - Travel System
# Defines API, worker, cron jobs in one file
services:
  - type: web
    name: travel-system-api
    env: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: ADMIN_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

  - type: worker
    name: travel-system-worker
    env: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

  - type: cron
    name: travel-system-reconciliation
    env: docker
    dockerfilePath: ./Dockerfile.worker
    schedule: "0 2 * * *"
    startCommand: celery -A app.workers.celery_app call app.workers.tasks.reconciliation.run_nightly_reconciliation
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_DATABASE_URL
        sync: false

  - type: cron
    name: travel-system-reminders
    env: docker
    dockerfilePath: ./Dockerfile.worker
    schedule: "0 1 * * *"
    startCommand: celery -A app.workers.celery_app call app.workers.tasks.reminders.send_daily_reminders
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_DATABASE_URL
        sync: false

  - type: cron
    name: travel-system-revenue-summary
    env: docker
    dockerfilePath: ./Dockerfile.worker
    schedule: "0 3 * * *"
    startCommand: celery -A app.workers.celery_app call app.workers.tasks.reports.generate_daily_revenue_summary
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_DATABASE_URL
        sync: false
