[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-system-backend"
version = "0.1.0"
description = "Travel System API"
authors = [{name="Travel System"}]
requires-python = ">=3.12,<3.15"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","I","B","UP","N","S","C4","DTZ","T10","T20","SIM","RUF"]
ignore = [
    "E501",    # line length enforced by formatter
    "S101",    # assert used in tests
    "B008",    # FastAPI Depends()/Query() default-arg idiom
    "RUF012",  # Pydantic model fields declared via annotated defaults
    "T201",    # print() used deliberately in CLI scripts and seeders
    "DTZ011",  # date.today() used for business-date logic (dates are tz-agnostic)
    "UP045",   # Optional[X] -> X | None left as-is to keep diffs reviewable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S104", "T201"]
"scripts/**" = ["S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
# celery's @app.task decorator is untyped; strict's default would reject it
disallow_untyped_decorators = false

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "resend",
    "structlog",
    "passlib",
    "passlib.*",
    "dateutil",
    "dateutil.*",
    "jose",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']
filterwarnings = ['ignore::DeprecationWarning']

